<style>
    /* 显示完整文章目录（包含子级标题，不再折叠隐藏） */
    #TableOfContents ul,
    #TableOfContents ol {
        display: block;
    }
</style>

<script>
    function initTocHide() {
        // 判断是否存在文章目录
        let toc = document.querySelector(".widget--toc");
        if (!toc) {
            return;
        }
        // 监听滚动
        window.addEventListener('scroll', function() {
            //清除class值
            let openUl = document.querySelectorAll(".open");
            if (openUl.length > 0) {
              openUl.forEach((ul) => {
                ul.classList.remove("open")
              })
            }
            // 获取active-class
            let currentLi = document.querySelector(".active-class");
            if (!currentLi) {
                return
            }
            // 展示子ul
            if (currentLi.children.length > 1) {
                currentLi.children[1].classList.add("open")
            }
            // 展示父ul
            let ul = currentLi.parentElement;
            do {
                ul.classList.add("open");
                ul = ul.parentElement.parentElement
            } while (ul !== undefined && (ul.localName === 'ul' || ul.localName === 'ol'))
        });
    }
    initTocHide()
</script>



<style>
    #backTopBtn {
        display: none;
        position: fixed;
        bottom: 30px;
        z-index: 99;
        cursor: pointer;
        width: 30px;
        height: 30px;
        background-image: url({{ (resources.Get "icons/backTop.svg").Permalink }});
    }
</style>

<script>
    /**
     * 滚动回顶部初始化
     */
    function initScrollTop() {
        // 恢复到原来的位置：优先挂回右侧边栏 .right-sidebar（与最初一致）
        let rightSideBar = document.querySelector(".right-sidebar");
        // PJAX 切换后 .right-sidebar 会被整体替换，先移除可能残留的旧按钮，避免重复
        document.querySelectorAll("#backTopBtn").forEach(function (el) { el.remove(); });
        let btn = document.createElement("div");
        btn.id = "backTopBtn";
        btn.onclick = backToTop;
        if (rightSideBar) {
            rightSideBar.appendChild(btn);
        } else {
            // 极少数没有右侧边栏的页面，兜底挂到 body 并靠右固定，保证按钮仍可用
            btn.style.right = "30px";
            document.body.appendChild(btn);
        }
        // 根据当前滚动位置更新按钮显隐
        function updateBackTop() {
            // 当网页向下滑动 20px 出现"返回顶部" 按钮
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        }
        // 用 addEventListener 绑定，先移除旧的再绑定，避免 PJAX 多次初始化后重复触发或丢监听
        window.removeEventListener("scroll", window.__backTopScroll);
        window.__backTopScroll = updateBackTop;
        window.addEventListener("scroll", window.__backTopScroll);
        updateBackTop();
    }

    /**
     * 返回顶部
     */
    function backToTop(){
        window.scrollTo({ top: 0, behavior: "smooth" })
    }

    initScrollTop();
</script>
